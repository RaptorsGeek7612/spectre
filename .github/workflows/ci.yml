name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # Solidity / Foundry part (Voting contract, Solidity 0.8.35).
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Check formatting
        run: forge fmt --check

      - name: Build
        run: forge build --sizes

      - name: Test
        run: forge test -vvv

      - name: Coverage
        run: forge coverage --report lcov

  # Python part (Spectre package). No ANTHROPIC_API_KEY: tests never hit the network.
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # setup-uv no longer publishes floating major tags (since v8): pin the
      # immutable release by commit SHA. Dependabot keeps it up to date.
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Test (no network) with coverage gate
        run: uv run pytest -m "not live" --cov=spectre --cov-report=lcov:lcov.info --cov-fail-under=90

  coverage-badge:
    needs: [test, python]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Generate Foundry coverage report
        run: |
          forge coverage --report lcov
          mv lcov.info lcov-foundry.info

      - name: Generate Python coverage report
        run: uv run pytest -m "not live" --cov=spectre --cov-report=lcov:lcov-python.info

      - name: Publish coverage badges
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # make_badge <lcov file> <label> <output json>
          make_badge() {
            LH=$(awk -F: '/^LH:/{s+=$2} END{print s+0}' "$1")
            LF=$(awk -F: '/^LF:/{s+=$2} END{print s+0}' "$1")
            read -r PCT COLOR <<< "$(awk -v h="$LH" -v f="$LF" 'BEGIN {
              if (f == 0) { printf "0.0 red"; exit }
              p = (h / f) * 100
              c = "red"
              if (p >= 90) c = "brightgreen"
              else if (p >= 75) c = "yellow"
              else if (p >= 50) c = "orange"
              printf "%.1f %s", p, c
            }')"
            echo "{\"schemaVersion\":1,\"label\":\"$2\",\"message\":\"${PCT}%\",\"color\":\"${COLOR}\"}" > "$3"
            echo "$2: ${PCT}%"
          }
          make_badge lcov-foundry.info "coverage" /tmp/coverage.json
          make_badge lcov-python.info "coverage (python)" /tmp/coverage-python.json
          FOUNDRY_PCT=$(sed -E 's/.*"message":"([^"]*)".*/\1/' /tmp/coverage.json)
          PYTHON_PCT=$(sed -E 's/.*"message":"([^"]*)".*/\1/' /tmp/coverage-python.json)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan badges-tmp
          git reset --hard
          cp /tmp/coverage.json coverage.json
          cp /tmp/coverage-python.json coverage-python.json
          git add coverage.json coverage-python.json
          git commit -m "Update coverage badges: Foundry ${FOUNDRY_PCT}, Python ${PYTHON_PCT}"
          git push origin HEAD:badges --force

  release:
    needs: [test, python]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check if CHANGELOG.md changed
        id: changed
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" | grep -qx CHANGELOG.md; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine release version and notes
        if: steps.changed.outputs.changed == 'true'
        id: changelog
        run: |
          VERSION_LINE=$(grep -m1 -E '^## \[[0-9]+\.[0-9]+\.[0-9]+\] - ' CHANGELOG.md || true)
          if [ -z "$VERSION_LINE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          VERSION=$(echo "$VERSION_LINE" | sed -E 's/^## \[([0-9]+\.[0-9]+\.[0-9]+)\].*/\1/')
          TAG="v$VERSION"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          PREV_TAG=$(git tag --sort=-v:refname | head -1 || true)
          awk -v ver="$VERSION" '
            BEGIN { printing=0 }
            /^## \[/ {
              if (printing) exit
              if ($0 ~ ("\\[" ver "\\]")) { printing=1; next }
              next
            }
            printing { print }
          ' CHANGELOG.md > release_notes.md
          if [ -n "$PREV_TAG" ]; then
            {
              echo ""
              echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
            } >> release_notes.md
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.changed.outputs.changed == 'true' && steps.changelog.outputs.skip == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.changelog.outputs.tag }}" -m "${{ steps.changelog.outputs.tag }}"
          git push origin "${{ steps.changelog.outputs.tag }}"
          gh release create "${{ steps.changelog.outputs.tag }}" \
            --title "${{ steps.changelog.outputs.tag }}" \
            --notes-file release_notes.md
