version: 2
updates:
  # Note: "gitsubmodule" is deliberately not tracked here. Dependabot has no
  # concept of a tagged release for git submodules — it only ever proposes
  # "bump to the latest commit on the tracked branch", which conflicts with
  # `foundry.lock` pinning our dependencies (forge-std, openzeppelin-contracts)
  # to specific release tags via `forge install <dep>@<tag>`. Bump those
  # manually with `forge install <dep>@<new-tag>` when a new release ships.
  # GitHub Actions used in .github/workflows (actions/checkout, astral-sh/setup-uv,
  # foundry-rs/foundry-toolchain). Each is pinned by commit SHA with a "# vX.Y.Z"
  # comment; Dependabot updates both together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies declared in pyproject.toml and locked in uv.lock.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      langchain:
        patterns:
          - "langchain-*"
          - "langgraph*"
      dev-tools:
        dependency-type: "development"
