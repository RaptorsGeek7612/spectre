[project]
name = "spectre"
version = "0.3.7"
description = "Spectre: a multi-agent Claude pipeline (Scout, Scribe, Warden) orchestrated with LangGraph."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "RaptorsGeek7612" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "langchain-core>=1.5.2",
    "langchain-anthropic>=1.5.3",
    "langgraph>=1.0",
    "python-dotenv>=1.0",
    "mcp>=2.3",
    "numpy>=2.0",
]

[project.optional-dependencies]
# Local voice for the assistant: wake word (Vosk), speech-to-text (faster-whisper), voice (Piper).
voice = [
    "numpy>=2.0",
    "sounddevice>=0.5",
    "vosk>=0.3.45",
    "faster-whisper>=1.2",
    "piper-tts>=1.8",
]
vision = ["numpy>=2.0", "opencv-python-headless>=4.10", "onnxruntime>=1.20"]

[project.scripts]
spectre = "spectre.cli:main"
spectre-web = "spectre.web.server:main"
spectre-assistant = "spectre.assistant.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spectre"]

[tool.hatch.build.targets.sdist]
include = ["src/spectre", "README.md", "LICENSE", "pyproject.toml"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["lib"]  # vendored Foundry submodules (third-party code)

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/spectre/assistant/db.py" = ["E501"]  # SQL schema reads better unwrapped
"tools/make_logo.py" = ["E501"]  # SVG markup and geometry read better unwrapped

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
# Optional voice extra: untyped, and absent from CI.
module = ["sounddevice", "vosk", "faster_whisper", "av", "piper", "piper.*", "cv2", "cv2.*", "onnxruntime"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: real Anthropic API calls"]
addopts = "-m 'not live'"

[tool.coverage.run]
# Hardware glue (microphone, speakers, Win32 windows): exercised by hand, not in CI.
omit = ["*/assistant/voice/engines.py", "*/assistant/winapi.py", "*/assistant/vision/camera.py"]
